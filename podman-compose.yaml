services:
  ProjectZomboidDedicatedServer:
    image: danixu86/project-zomboid-dedicated-server:beta-branch-root
    restart: unless-stopped
    build:
      context: .
      dockerfile: Containerfile
      args:
        - STEAMAPPBRANCH=${STEAMAPPBRANCH}
    env_file:
      - .env
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
    volumes:
      # Server data
      - ./data:/home/steam/Zomboid:z
      # Workshop mods folder
      - ./workshop-mods:/home/steam/pz-dedicated/steamapps/workshop:z
